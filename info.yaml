# Tiny Tapeout project information
project:
  title:        "RV32I SoC (SERV) with QSPI flash + PSRAM"
  author:       "rhgndf"
  discord:      ""
  description:  "SERV RV32I SoC executing from QSPI flash with PSRAM data memory and register file, GPIO"
  language:     "Verilog"
  clock_hz:     50000000

  tiles: "1x1"

  top_module:  "tt_um_rhgndf_rv32i_soc"

  source_files:
    - "serv/serv_bufreg.v"
    - "serv/serv_bufreg2.v"
    - "serv/serv_alu.v"
    - "serv/serv_csr.v"
    - "serv/serv_ctrl.v"
    - "serv/serv_decode.v"
    - "serv/serv_immdec.v"
    - "serv/serv_mem_if.v"
    - "serv/serv_rf_if.v"
    - "serv/serv_rf_ram_if.v"
    - "serv/serv_rf_ram.v"
    - "serv/serv_state.v"
    - "serv/serv_debug.v"
    - "serv/serv_aligner.v"
    - "serv/serv_compdec.v"
    - "serv/serv_top.v"
    - "qspi_ctrl.v"
    - "rf_adapter.v"
    - "gpio.v"
    - "tt_um_rhgndf_rv32i_soc.v"

pinout:
  # Inputs
  ui[0]: "GPIO in 0"
  ui[1]: "GPIO in 1"
  ui[2]: "GPIO in 2"
  ui[3]: "GPIO in 3"
  ui[4]: "GPIO in 4"
  ui[5]: "GPIO in 5"
  ui[6]: "GPIO in 6"
  ui[7]: "GPIO in 7"

  # Outputs
  uo[0]: "GPIO out 0 (bit-banged UART TX)"
  uo[1]: "GPIO out 1"
  uo[2]: "GPIO out 2"
  uo[3]: "GPIO out 3"
  uo[4]: "GPIO out 4"
  uo[5]: "GPIO out 5"
  uo[6]: "GPIO out 6"
  uo[7]: "GPIO out 7"

  # Bidirectional pins (QSPI Pmod)
  uio[0]: "QSPI CS0 flash (out)"
  uio[1]: "QSPI SD0 (bidir)"
  uio[2]: "QSPI SD1 (bidir)"
  uio[3]: "QSPI SCK (out)"
  uio[4]: "QSPI SD2 (bidir)"
  uio[5]: "QSPI SD3 (bidir)"
  uio[6]: "QSPI CS1 PSRAM (out)"
  uio[7]: "QSPI CS2 (out, always high)"

# Do not change!
yaml_version: 6

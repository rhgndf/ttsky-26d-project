# Tiny Tapeout project information
project:
  title:        "RV32I SoC with QSPI PSRAM"
  author:       "rhgndf"
  discord:      ""
  description:  "RV32I microcontroller SoC executing from external QSPI PSRAM, with UART, GPIO, SPI, I2C and timer peripherals"
  language:     "Verilog"
  clock_hz:     50000000

  tiles: "1x1"

  top_module:  "tt_um_rhgndf_rv32i_soc"

  source_files:
    - "rv32i_core.v"
    - "qspi_psram.v"
    - "uart.v"
    - "timer.v"
    - "serial.v"
    - "tt_um_rhgndf_rv32i_soc.v"

pinout:
  # Inputs
  ui[0]: "SPI MISO"
  ui[1]: "GPIO in"
  ui[2]: "GPIO in"
  ui[3]: "GPIO in"
  ui[4]: "GPIO in"
  ui[5]: "GPIO in"
  ui[6]: "GPIO in"
  ui[7]: "GPIO in"

  # Outputs
  uo[0]: "UART TX"
  uo[1]: "SPI SCK"
  uo[2]: "SPI MOSI"
  uo[3]: "SPI CS_n"
  uo[4]: "GPIO out 0"
  uo[5]: "GPIO out 1"
  uo[6]: "GPIO out 2"
  uo[7]: "GPIO out 3"

  # Bidirectional pins
  uio[0]: "PSRAM CS_n (out)"
  uio[1]: "PSRAM SCK (out)"
  uio[2]: "PSRAM SD0 (bidir)"
  uio[3]: "PSRAM SD1 (bidir)"
  uio[4]: "PSRAM SD2 (bidir)"
  uio[5]: "PSRAM SD3 (bidir)"
  uio[6]: "I2C SDA (open drain)"
  uio[7]: "I2C SCL (open drain)"

# Do not change!
yaml_version: 6
